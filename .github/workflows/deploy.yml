name: Deploy to GitHub Pages

on:
  # Deploy on every push to main.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Optional: set a Formspree form id as a repo variable to make the
          # waitlist form submit to Formspree. If unset, the form falls back to
          # a pre-filled email. Settings -> Secrets and variables -> Actions -> Variables.
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ID }}
          # Optional override for the brand email domain; defaults to the site domain.
          BRAND_DOMAIN_OVERRIDE: ${{ vars.NEXT_PUBLIC_BRAND_DOMAIN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # Adapt the URL/base path to the deployment target automatically:
          #  - public/CNAME present  -> custom domain served at the root
          #  - otherwise             -> project page at /<repo>
          if [ -f public/CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < public/CNAME)"
            export NEXT_PUBLIC_SITE_URL="https://$DOMAIN"
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_BRAND_DOMAIN="${BRAND_DOMAIN_OVERRIDE:-$DOMAIN}"
          else
            export NEXT_PUBLIC_SITE_URL="https://${{ github.repository_owner }}.github.io"
            export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}"
            export NEXT_PUBLIC_BRAND_DOMAIN="${BRAND_DOMAIN_OVERRIDE}"
          fi
          echo "Building for $NEXT_PUBLIC_SITE_URL (base path: '${NEXT_PUBLIC_BASE_PATH}')"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
